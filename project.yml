name: USBWebcam
options:
  bundleIdPrefix: com.eni.lo
targets:
  USBWebcam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iOS
        excludes: ["Info.plist"]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: USC-CAM
        CFBundleName: USC-CAM
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "USC-CAM uses the camera to stream high quality video to your PC over the USB cable."
        NSMicrophoneUsageDescription: "USC-CAM sends the phone microphone to your PC."
        NSBonjourServices: ["_usccam._tcp"]
        NSLocalNetworkUsageDescription: "USC-CAM streams the camera to your PC over your local Wi-Fi network."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eni.lo.USBWebcam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
